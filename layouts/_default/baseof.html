<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <title>{{ .Title }} — Candela De Franco</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}Portfolio de Candela De Franco — Desarrolladora{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  {{ $css := resources.Get "css/main.css" | resources.PostCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body class="min-h-screen flex items-center justify-center p-6 md:p-8">
  {{ block "main" . }}{{ end }}
  <script>
    let currentSlide = 0;
    const track = document.querySelector('.carousel-track');
    const dots = document.querySelectorAll('.dot');
    const totalSlides = dots.length;

    function updateCarousel() {
      if (track) track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
      dots.forEach((d, i) => d.classList.toggle('dot-active', i === currentSlide));
    }

    function moveCarousel(dir) {
      currentSlide = (currentSlide + dir + totalSlides) % totalSlides;
      updateCarousel();
    }

    function goToSlide(i) {
      currentSlide = i;
      updateCarousel();
    }

    // Auto-advance every 4s
    setInterval(function() { moveCarousel(1); }, 4000);

    // Language toggle
    let currentLang = 'en';

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'es' : 'en';
      document.getElementById('lang-btn').textContent = currentLang === 'en' ? 'ES' : 'EN';
      document.querySelectorAll('[data-en]').forEach(function(el) {
        el.textContent = el.getAttribute('data-' + currentLang);
      });
      document.documentElement.lang = currentLang === 'en' ? 'en' : 'es';
    }
  </script>
</body>
</html>
