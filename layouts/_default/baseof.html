<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F172A">
  <title>{{ .Title }} — Cande De Franco</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}Portfolio de Cande De Franco{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  {{ $css := resources.Get "css/main.css" | resources.PostCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body class="bg-bg text-white font-sora min-h-screen">
  {{ block "main" . }}{{ end }}
</body>
</html>
